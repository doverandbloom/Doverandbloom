<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed Waivers | Dover &amp; Bloom Staff</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/waivers-admin.js" defer></script>
</head>
<body data-page="staff-waivers" class="kiosk">
  <header class="kiosk-head">
    <img src="images/logo-mark.webp" alt="">
    <div><p class="eyebrow">Staff only</p><h1>Signed Waivers</h1></div>
  </header>
  <main class="kiosk-main">
    <form class="kiosk-card staff-login">
      <label>Staff password<input name="pw" type="password" autocomplete="current-password" required></label>
      <p class="form-error" role="alert"></p>
      <button class="btn" type="submit">Open</button>
    </form>

    <section class="staff-view" hidden>
      <div class="kiosk-card staff-tools">
        <label>Day<input name="date" type="date"></label>
        <label>Search all waivers<input name="q" type="search" placeholder="Name, email or phone"></label>
        <div class="staff-buttons">
          <button type="button" class="btn btn--small staff-load">Show</button>
          <button type="button" class="btn btn--ghost btn--small staff-csv">Download CSV</button>
          <button type="button" class="btn btn--ghost btn--small staff-print">Print</button>
          <button type="button" class="btn btn--ghost btn--small staff-logout">Lock</button>
        </div>
      </div>
      <p class="staff-count" aria-live="polite"></p>
      <div class="staff-list"></div>
    </section>
  </main>
</body>
</html>
